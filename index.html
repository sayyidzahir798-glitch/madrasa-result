<!DOCTYPE html>
<html lang="ml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Madrasa Exam Result</title>
    <!-- ഗൂഗിൾ ഫോണ്ട് (മലയാളം അക്ഷരങ്ങൾ ഭംഗിയാക്കാൻ) -->
    <link href="https://fonts.googleapis.com/css2?family=Manjari:wght@400;700&display=swap" rel="stylesheet">
    <style>
        /* ബാക്ക്ഗ്രൗണ്ട് ഡിസൈൻ */
        body { 
            font-family: 'Manjari', sans-serif; 
            text-align: center; 
            margin: 0;
            padding: 20px;
            background: linear-gradient(135deg, #e0f7fa 0%, #80cbc4 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        /* പ്രധാന ബോക്സ് (Card) */
        .container { 
            background: #ffffff; 
            padding: 30px 25px; 
            width: 100%; 
            max-width: 360px; 
            border-radius: 20px; 
            box-shadow: 0 15px 35px rgba(0,0,0,0.15); 
        }
        
        h2 { 
            color: #00695c; 
            margin-top: 0;
            margin-bottom: 25px; 
            font-size: 26px;
            font-weight: 700;
        }
        /* ടെക്സ്റ്റ് ബോക്സ് */
        input { 
            padding: 14px; 
            width: 85%; 
            margin-bottom: 20px; 
            border: 2px solid #e0e0e0; 
            border-radius: 10px; 
            font-size: 16px; 
            text-align: center;
            outline: none;
            transition: border-color 0.3s;
        }
        input:focus {
            border-color: #00897b;
        }
        /* ബട്ടൺ ഡിസൈൻ */
        button { 
            padding: 14px 25px; 
            background: linear-gradient(45deg, #00897b, #00695c); 
            color: white; 
            border: none; 
            border-radius: 10px; 
            font-size: 18px; 
            font-weight: bold; 
            cursor: pointer; 
            width: 95%;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        button:hover { 
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0, 105, 92, 0.4);
        }
        
        #result { margin-top: 25px; text-align: left; }
        
        /* പേര് കാണിക്കുന്ന ഭാഗം */
        .student-name { 
            font-size: 20px; 
            font-weight: bold; 
            text-align: center; 
            color: #fff; 
            background: #00796b;
            margin-bottom: 20px; 
            padding: 12px; 
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        /* മാർക്ക് ടേബിൾ ഡിസൈൻ */
        table { 
            width: 100%; 
            border-collapse: separate; 
            border-spacing: 0;
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid #eeeeee;
        }
        th, td { 
            padding: 12px 10px; 
            font-size: 16px; 
            border-bottom: 1px solid #eeeeee;
        }
        th { 
            background-color: #f8fcfb; 
            color: #555; 
            width: 65%; 
            text-align: left;
        }
        td { 
            font-weight: bold; 
            text-align: center; 
            color: #222; 
            background-color: #fff;
        }
        tr:last-child th, tr:last-child td {
            border-bottom: none;
        }
        /* ആകെ മാർക്കിന്റെ വരി */
        .total-row th, .total-row td { 
            background-color: #e0f2f1; 
            color: #00695c; 
            font-size: 18px; 
            font-weight: 900;
        }
        /* ഗ്രേഡ് ബാഡ്ജ് (Badge) */
        .grade-badge {
            display: inline-block;
            padding: 6px 12px;
            background-color: #ffb300;
            color: #fff;
            border-radius: 20px;
            font-size: 14px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 2px 5px rgba(255, 179, 0, 0.4);
        }
    </style>
</head>
<body>

<div class="container">
    <h2>പരീക്ഷാ ഫലം</h2>
    <input type="text" id="regInput" placeholder="രജിസ്റ്റർ നമ്പർ നൽകുക">
    <button onclick="fetchResult()">റിസൾട്ട് കാണുക</button>

    <div id="result"></div>
</div>

<script>
    function fetchResult() {
        let regNo = document.getElementById("regInput").value.trim();
        let resultDiv = document.getElementById("result");

        if(regNo === "") {
            resultDiv.innerHTML = "<p style='color:#d32f2f; text-align:center; font-weight:bold;'>ദയവായി രജിസ്റ്റർ നമ്പർ നൽകുക!</p>";
            return;
        }

        fetch('data.json')
            .then(response => response.json())
            .then(data => {
                let student = data.find(s => s.regno === regNo);
                if (student) {
                    resultDiv.innerHTML = `
                        <div class="student-name">🎓 ${student.name}</div>
                        <table>
                            <tr><th>ഫിഖ്ഹ് (Fiqh)</th><td>${student.fiqh}</td></tr>
                            <tr><th>ലിസാനുൽ ഖുർആൻ</th><td>${student.liqur}</td></tr>
                            <tr><th>ദുറുസുൽ ഇഹ്സാൻ</th><td>${student.durihsan}</td></tr>
                            <tr><th>തഫ്സീർ (Thafsir)</th><td>${student.thafsir}</td></tr>
                            <tr class="total-row"><th>ആകെ മാർക്ക്</th><td>${student.total}</td></tr>
                            <tr><th>ഗ്രേഡ് (Grade)</th><td><span class="grade-badge">${student.grade}</span></td></tr>
                        </table>
                    `;
                } else {
                    resultDiv.innerHTML = "<p style='color:#d32f2f; text-align:center; font-weight:bold;'>ഈ രജിസ്റ്റർ നമ്പർ കണ്ടെത്താനായില്ല!</p>";
                }
            })
            .catch(error => {
                resultDiv.innerHTML = "<p style='color:#d32f2f; text-align:center; font-weight:bold;'>സാങ്കേതിക തകരാർ. വീണ്ടും ശ്രമിക്കുക.</p>";
            });
    }
</script>
</body>
</html>
